<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="下载安装三步：下载 zip、解压到文件夹、双击 exe 运行">
  <defs>
    <style>
      .t { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Helvetica, Arial, sans-serif; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .title { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .desc { font-size: 13px; fill: #6b7280; }
      .arrow { stroke: #c7d2e0; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="210" fill="#ffffff"/>

  <!-- 卡片 1 -->
  <g>
    <rect x="14" y="26" width="252" height="158" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="46" cy="58" r="16" fill="#2563eb"/>
    <text class="t num" x="46" y="63.5" text-anchor="middle">1</text>
    <text class="t title" x="74" y="64">下载</text>
    <text class="t desc" x="38" y="104">点 README 里的下载链接，</text>
    <text class="t desc" x="38" y="126">把 zip 保存到电脑</text>
    <text class="t desc" x="38" y="156" fill="#2563eb">TextToVideo-win64.zip</text>
  </g>

  <!-- 箭头 -->
  <path class="arrow" d="M274 105 L306 105"/>
  <path class="arrow" d="M298 99 L308 105 L298 111"/>

  <!-- 卡片 2 -->
  <g>
    <rect x="318" y="26" width="252" height="158" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="350" cy="58" r="16" fill="#2563eb"/>
    <text class="t num" x="350" y="63.5" text-anchor="middle">2</text>
    <text class="t title" x="378" y="64">解压</text>
    <text class="t desc" x="342" y="104">右键 → 全部解压缩，</text>
    <text class="t desc" x="342" y="126">得到完整文件夹</text>
    <text class="t desc" x="342" y="156" fill="#dc2626">别在压缩包里直接运行</text>
  </g>

  <!-- 箭头 -->
  <path class="arrow" d="M578 105 L610 105"/>
  <path class="arrow" d="M602 99 L612 105 L602 111"/>

  <!-- 卡片 3 -->
  <g>
    <rect x="622" y="26" width="264" height="158" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="654" cy="58" r="16" fill="#2563eb"/>
    <text class="t num" x="654" y="63.5" text-anchor="middle">3</text>
    <text class="t title" x="682" y="64">双击运行</text>
    <text class="t desc" x="646" y="104">双击文件夹里的</text>
    <text class="t desc" x="646" y="126">文字图片转视频工具.exe</text>
    <text class="t desc" x="646" y="156" fill="#16a34a">无需安装，开箱即用</text>
  </g>
</svg>
